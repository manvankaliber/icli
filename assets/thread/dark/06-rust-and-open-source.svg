f3" >macOS</text><text x="1090" y="674" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#a4a8ad" >Native executable</text><path d="M1474 602 l6 6 13-15" fill="none" stroke="#54d69a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="820" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#f1f2f3" >Inspect the code. Build it. Contribute.</text><text x="1536" y="820" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#a4a8ad" text-anchor="end" letter-spacing="1.5">MIT LICENSE</text><path d="M64 916 H1536" stroke="#37393c" stroke-width="2"/><text x="64" y="958" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#a4a8ad" >github.com/manvankaliber/icli</text><text x="1536" y="958" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#a4a8ad" text-anchor="end">06 / 06</text><text x="64" y="891" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#a4a8ad" >Independent project. Not affiliated with or endorsed by Apple.</text></svg>