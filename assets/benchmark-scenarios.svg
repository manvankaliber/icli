<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 432" role="img" aria-labelledby="title desc">
<title id="title">Performance benchmark scenarios and metrics</title>
<desc id="desc">Four proposed benchmark scenarios with measurement fields awaiting repeatable runs. All results are TBD.</desc>
<style>
:root{--surface:#fff;--ink:#17191d;--muted:#626a73;--line:#d8dce1;--hair:#eceef1;--tag:#eef0f3;--tagink:#626a73;--track:#f2f3f5}
@media(prefers-color-scheme:dark){:root{--surface:#151515;--ink:#f1f2f3;--muted:#a4a8ad;--line:#37393c;--hair:#292b2e;--tag:#292b2e;--tagink:#c2c6cb;--track:#242424}}
.card{fill:var(--surface);stroke:var(--line);stroke-width:1}.title{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}.description{font:400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted)}.metric{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}.value{font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--tagink);text-anchor:middle}.tag{fill:var(--tag)}.track{fill:var(--track)}.rule{stroke:var(--hair);stroke-width:1}.pill{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}.small{font:600 8px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted);letter-spacing:.07em}
</style>
<g transform="translate(0,0)"><rect class="card" x="0.5" y="0.5" width="477" height="204" rx="15"/><text class="title" x="18" y="28">Annual meeting report</text><text class="description" x="18" y="47">Sum meeting hours across 10 calendars, then email the total</text><line class="rule" x1="18" y1="61" x2="459" y2="61"/><text class="small" x="18" y="81">MEASURE</text><text class="small" x="411" y="81" text-anchor="middle">RESULT</text><text class="metric" x="18" y="108">End-to-end time ? median / p95</text><rect class="tag" x="382" y="91" width="58" height="24" rx="8"/><text class="value" x="411" y="107">TBD</text><line class="rule" x1="18" y1="122" x2="459" y2="122"/><text class="metric" x="18" y="148">Model tokens ? input + output</text><rect class="tag" x="382" y="131" width="58" height="24" rx="8"/><text class="value" x="411" y="147">TBD</text><line class="rule" x1="18" y1="162" x2="459" y2="162"/><text class="metric" x="18" y="188">Task success ? completed without repair</text><rect class="tag" x="382" y="171" width="58" height="24" rx="8"/><text class="value" x="411" y="187">TBD</text></g>
<g transform="translate(490,0)"><rect class="card" x="0.5" y="0.5" width="477" height="204" rx="15"/><text class="title" x="18" y="28">Next week: events + contacts</text><text class="description" x="18" y="47">Fetch events, then look up the phone numbers of invitees</text><line class="rule" x1="18" y1="61" x2="459" y2="61"/><text class="small" x="18" y="81">MEASURE</text><text class="small" x="411" y="81" text-anchor="middle">RESULT</text><text class="metric" x="18" y="108">End-to-end time ? median / p95</text><rect class="tag" x="382" y="91" width="58" height="24" rx="8"/><text class="value" x="411" y="107">TBD</text><line class="rule" x1="18" y1="122" x2="459" y2="122"/><text class="metric" x="18" y="148">Model tokens ? input + output</text><rect class="tag" x="382" y="131" width="58" height="24" rx="8"/><text class="value" x="411" y="147">TBD</text><line class="rule" x1="18" y1="162" x2="459" y2="162"/><text class="metric" x="18" y="188">Task success ? all requested numbers found</text><rect class="tag" x="382" y="171" width="58" height="24" rx="8"/><text class="value" x="411" y="187">TBD</text></g>
<g transform="translate(0,216)"><rect class="card" x="0.5" y="0.5" width="477" height="204" rx="15"/><text class="title" x="18" y="28">Personalized email draft</text><text class="description" x="18" y="47">Turn a supplied meeting summary into one unsent draft</text><line class="rule" x1="18" y1="61" x2="459" y2="61"/><text class="small" x="18" y="81">MEASURE</text><text class="small" x="411" y="81" text-anchor="middle">RESULT</text><text class="metric" x="18" y="108">End-to-end time ? median / p95</text><rect class="tag" x="382" y="91" width="58" height="24" rx="8"/><text class="value" x="411" y="107">TBD</text><line class="rule" x1="18" y1="122" x2="459" y2="122"/><text class="metric" x="18" y="148">Model tokens ? input + output</text><rect class="tag" x="382" y="131" width="58" height="24" rx="8"/><text class="value" x="411" y="147">TBD</text><line class="rule" x1="18" y1="162" x2="459" y2="162"/><text class="metric" x="18" y="188">Task success ? draft saved as requested</text><rect class="tag" x="382" y="171" width="58" height="24" rx="8"/><text class="value" x="411" y="187">TBD</text></g>
<g transform="translate(490,216)"><rect class="card" x="0.5" y="0.5" width="477" height="204" rx="15"/><text class="title" x="18" y="28">Direct CLI runtime</text><text class="description" x="18" y="47">Read events from 10 calendars and related contact records</text><line class="rule" x1="18" y1="61" x2="459" y2="61"/><text class="small" x="18" y="81">MEASURE</text><text class="small" x="411" y="81" text-anchor="middle">RESULT</text><text class="metric" x="18" y="108">Command latency ? median / p95</text><rect class="tag" x="382" y="91" width="58" height="24" rx="8"/><text class="value" x="411" y="107">TBD</text><line class="rule" x1="18" y1="122" x2="459" y2="122"/><text class="metric" x="18" y="148">Local CPU time ? per task</text><rect class="tag" x="382" y="131" width="58" height="24" rx="8"/><text class="value" x="411" y="147">TBD</text><line class="rule" x1="18" y1="162" x2="459" y2="162"/><text class="metric" x="18" y="188">Peak memory ? RSS</text><rect class="tag" x="382" y="171" width="58" height="24" rx="8"/><text class="value" x="411" y="187">TBD</text></g>
</svg>
