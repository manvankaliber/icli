name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install keyring build dependencies
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: node scripts/sync-agent-docs.mjs --check
      - run: python3 -m unittest discover -s mcp -p 'test_*.py'
  build:
    needs: validate
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux keyring build dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libdbus-1-dev
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/icli package/icli
          archive="icli-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -C package -czf "$archive" icli
          shasum -a 256 "$archive" | cut -d' ' -f1 > "$archive.sha256"
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "icli-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/icli.exe" -DestinationPath $archive
          (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() | Set-Content -NoNewline "$archive.sha256"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'workflow_dispatch' || github.event.created == true)
        with:
          draft: true
          body_path: RELEASE_NOTES.md
          files: |
            icli-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
            icli-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'workflow_dispatch' || github.event.created == true)
    runs-on: ubuntu-latest
    steps:
      - name: Publish only after all platform archives are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
