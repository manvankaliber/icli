[package]
name = "icli"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "A small agent-friendly CLI for iCloud Calendar, Mail, and Contacts"
license = "MIT"

[package.metadata.icli]
# Update this date with package.version when publishing a release.
release-date = "2026-10-20"

[[bin]]
name = "icli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
ical = "0.11"
imap = "2.4.1"
keyring = "4.2"
mailparse = "0.16"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "rustls-tls"] }
roxmltree = "0.21"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
self-replace = "1.5"
tempfile = "3"
flate2 = "1"
tar = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
unicode-case-mapping = "1"
unicode-normalization = "0.1"

[profile.release]
opt-level = "z"
strip = "symbols"
